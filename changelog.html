<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>更新日志 — 掩耳</title>
    <link rel="icon" href="icon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #f5f5f5; --surface: #fff; --border: #e0e0e0;
            --text: #222; --text-dim: #666; --accent: #2563eb;
            --radius: 8px;
        }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #1a1a1a; --surface: #252525; --border: #333; --text: #e0e0e0; --text-dim: #888; --accent: #60a5fa; }
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background: var(--bg); color: var(--text); line-height: 1.7;
        }
        .container { max-width: 720px; margin: 0 auto; padding: 48px 24px; }
        .nav-bar {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 40px;
        }
        .nav-bar a {
            color: var(--accent); text-decoration: none; font-size: 14px;
        }
        .nav-bar a:hover { text-decoration: underline; }
        .lang-toggle {
            padding: 4px 10px; border: 1px solid var(--border); border-radius: var(--radius);
            background: var(--surface); color: var(--text-dim); cursor: pointer;
            font-size: 13px; font-family: inherit;
        }
        .lang-toggle:hover { border-color: var(--accent); color: var(--accent); }
        .markdown { overflow-wrap: break-word; }
        .markdown h1 { font-size: 24px; font-weight: 700; margin-bottom: 24px; }
        .markdown h2 {
            font-size: 18px; font-weight: 600; margin: 32px 0 12px; padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }
        .markdown h3 { font-size: 16px; font-weight: 600; margin: 24px 0 8px; }
        .markdown ul { list-style: none; margin-bottom: 16px; }
        .markdown li {
            font-size: 14px; color: var(--text-dim); padding: 3px 0;
        }
        .markdown li::before { content: '- '; color: var(--accent); }
        .markdown p { font-size: 14px; color: var(--text-dim); margin-bottom: 12px; }
        .markdown strong { color: var(--text); font-weight: 600; }
        .markdown code {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 4px; padding: 1px 6px; font-size: 13px;
        }
        .loading { color: var(--text-dim); font-size: 14px; }
        .error { color: var(--text-dim); font-size: 14px; }
        footer {
            text-align: center; padding: 48px 0 0; color: var(--text-dim);
            font-size: 13px; border-top: 1px solid var(--border); margin-top: 48px;
        }
        footer a { color: var(--accent); text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-bar">
            <a href="index.html" data-i18n="back">&larr; 返回首页</a>
            <button class="lang-toggle" onclick="toggleLang()">EN</button>
        </div>
        <div id="content" class="markdown">
            <div class="loading" data-i18n="loading">加载中...</div>
        </div>
        <footer>
            <p>© 2026 Yaner</p>
        </footer>
    </div>

    <script>
        function renderMarkdown(md) {
            let html = '';
            const lines = md.split('\n');
            let inList = false;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];

                if (line.startsWith('# ')) {
                    if (inList) { html += '</ul>\n'; inList = false; }
                    html += '<h1>' + escapeHtml(line.slice(2)) + '</h1>\n';
                } else if (line.startsWith('## ')) {
                    if (inList) { html += '</ul>\n'; inList = false; }
                    html += '<h2>' + escapeHtml(line.slice(3)) + '</h2>\n';
                } else if (line.startsWith('### ')) {
                    if (inList) { html += '</ul>\n'; inList = false; }
                    html += '<h3>' + escapeHtml(line.slice(4)) + '</h3>\n';
                } else if (line.startsWith('- ')) {
                    if (!inList) { html += '<ul>\n'; inList = true; }
                    html += '<li>' + escapeHtml(line.slice(2)) + '</li>\n';
                } else if (line.trim() === '') {
                    if (inList) { html += '</ul>\n'; inList = false; }
                } else {
                    if (inList) { html += '</ul>\n'; inList = false; }
                    html += '<p>' + escapeHtml(line) + '</p>\n';
                }
            }
            if (inList) html += '</ul>\n';

            return html
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        }

        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        const i18n = {
            zh: {
                'back': '&larr; 返回首页',
                'loading': '加载中...',
                'error': '无法加载更新日志。',
            },
            en: {
                'back': '&larr; Home',
                'loading': 'Loading...',
                'error': 'Failed to load changelog.',
            }
        };

        let currentLang = 'zh';

        function applyI18n() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[currentLang][key]) el.innerHTML = i18n[currentLang][key];
            });
        }

        // Load and render CHANGELOG.md
        function loadChangelog(lang) {
            const file = lang === 'zh' ? 'CHANGELOG.zh.md' : 'CHANGELOG.en.md';
            document.getElementById('content').innerHTML = '<div class="loading" data-i18n="loading">' + i18n[lang].loading + '</div>';
            fetch(file)
                .then(r => {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.text();
                })
                .then(md => {
                    document.getElementById('content').innerHTML = renderMarkdown(md);
                    applyI18n();
                })
                .catch(() => {
                    document.getElementById('content').innerHTML = '<p class="error" data-i18n="error">' + i18n[lang].error + '</p>';
                    applyI18n();
                });
        }

        function setLang(lang) {
            currentLang = lang;
            document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
            document.title = lang === 'zh' ? '更新日志 — 掩耳' : 'Changelog — Yaner';
            applyI18n();
            document.querySelector('.lang-toggle').textContent = lang === 'zh' ? 'EN' : '中文';
            loadChangelog(lang);
        }

        function toggleLang() {
            setLang(currentLang === 'zh' ? 'en' : 'zh');
        }

        loadChangelog('zh');
    </script>
</body>
</html>
